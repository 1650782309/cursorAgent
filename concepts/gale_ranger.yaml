id: gale_ranger
name: 盖尔
archetype: ranger
summary: 轻甲游侠，斗篷短、腿部动作幅度大，适合验证走跑循环下的重绘覆盖率。

canvas:
  width: 448
  height: 576
  origin_x: 224
  origin_y: 520

palette:
  skin: "#e8c3a0"
  skin_shadow: "#c99b78"
  hair: "#4f6b3f"
  hair_dark: "#33472a"
  cloth_main: "#5c7a4a"
  cloth_dark: "#3b5230"
  cloth_accent: "#c2833c"
  metal: "#9aa4ad"
  eye: "#c9a227"
  leather: "#6b4a2f"

rig:
  unit: 4.0
  hip_height: 44
  torso: 15
  chest: 12
  neck: 4
  head: 15
  upper_arm: 12
  lower_arm: 12
  hand: 4
  thigh: 19
  shin: 18
  foot: 6
  shoulder_span: 9
  hip_span: 5

animations: [idle, walk, run, wave]

groups:
  - [L_thigh, L_shin, L_foot]
  - [R_thigh, R_shin, R_foot]
  - [body_cloth, skirt]

parts:
  - {name: cape,        bone: chest,       shape: cape,    size: [24, 32], offset: [0, -3],  color: cloth_dark,   order: 0,  tags: [cloth, back]}
  - {name: back_hair,   bone: head,        shape: bell,    size: [18, 22], offset: [0, 5],   color: hair_dark,    order: 1,  redraw: false, tags: [hair]}
  - {name: L_thigh,     bone: thigh_l,     shape: capsule, size: [8, 19],  offset: [0, 9.5], color: cloth_dark,   order: 2,  tags: [cloth, lower]}
  - {name: L_shin,      bone: shin_l,      shape: capsule, size: [7, 18],  offset: [0, 9],   color: leather,      order: 3,  tags: [cloth, lower]}
  - {name: L_foot,      bone: foot_l,      shape: plate,   size: [10, 6],  offset: [1, 2],   color: leather,      order: 4,  tags: [cloth, lower, shoe]}
  - {name: L_sleeve,    bone: upper_arm_l, shape: capsule, size: [7, 13],  offset: [0, 6],   color: cloth_main,   order: 5,  tags: [cloth, upper]}
  - {name: L_cuff,      bone: lower_arm_l, shape: capsule, size: [6, 12],  offset: [0, 6],   color: leather,      order: 6,  tags: [cloth, upper]}
  - {name: L_hand,      bone: hand_l,      shape: ellipse, size: [5, 5],   offset: [0, 2],   color: skin,         order: 7,  redraw: false, tags: [skin]}
  - {name: body_cloth,  bone: torso,       shape: capsule, size: [15, 27], offset: [0, 12],  color: cloth_main,   order: 8,  tags: [cloth, upper]}
  - {name: sash,        bone: torso,       shape: plate,   size: [16, 4],  offset: [0, 3],   color: leather,      order: 9,  tags: [cloth, accessory]}
  - {name: skirt,       bone: hip,         shape: bell,    size: [20, 14], offset: [0, -5],  color: cloth_dark,   order: 10, tags: [cloth, lower]}
  - {name: R_thigh,     bone: thigh_r,     shape: capsule, size: [8, 19],  offset: [0, 9.5], color: cloth_dark,   order: 11, tags: [cloth, lower]}
  - {name: R_shin,      bone: shin_r,      shape: capsule, size: [7, 18],  offset: [0, 9],   color: leather,      order: 12, tags: [cloth, lower]}
  - {name: R_foot,      bone: foot_r,      shape: plate,   size: [10, 6],  offset: [1, 2],   color: leather,      order: 13, tags: [cloth, lower, shoe]}
  - {name: neck,        bone: neck,        shape: capsule, size: [5, 5],   offset: [0, 2],   color: skin_shadow,  order: 14, redraw: false, tags: [skin]}
  - {name: collar,      bone: chest,       shape: plate,   size: [13, 4],  offset: [0, 11],  color: cloth_accent, order: 15, tags: [cloth, accessory]}
  - {name: head_base,   bone: head,        shape: ellipse, size: [15, 17], offset: [0, 8],   color: skin,         order: 16, redraw: false, tags: [skin, face]}
  - {name: L_eye,       bone: head,        shape: ellipse, size: [3, 4],   offset: [-3.4, 7], color: eye,         order: 17, redraw: false, tags: [face]}
  - {name: R_eye,       bone: head,        shape: ellipse, size: [3, 4],   offset: [3.4, 7],  color: eye,         order: 18, redraw: false, tags: [face]}
  - {name: front_hair,  bone: head,        shape: bell,    size: [17, 11], offset: [0, 12],  color: hair,         order: 19, redraw: false, tags: [hair]}
  - {name: hood,        bone: chest,       shape: bell,    size: [17, 10], offset: [0, 12],  color: cloth_dark,   order: 20, tags: [cloth, accessory]}
  - {name: R_sleeve,    bone: upper_arm_r, shape: capsule, size: [7, 13],  offset: [0, 6],   color: cloth_main,   order: 21, tags: [cloth, upper]}
  - {name: R_cuff,      bone: lower_arm_r, shape: capsule, size: [6, 12],  offset: [0, 6],   color: leather,      order: 22, tags: [cloth, upper]}
  - {name: R_hand,      bone: hand_r,      shape: ellipse, size: [5, 5],   offset: [0, 2],   color: skin,         order: 23, redraw: false, tags: [skin]}
  - {name: bow,         bone: hand_r,      shape: blade,   size: [4, 38],  offset: [2, 6],   rotation: 4, color: leather, order: 24, tags: [weapon]}

outfits:
  frost_scout:
    prompt: >-
      masterpiece, best quality, 1boy, frost scout gear, white fur trimmed coat,
      pale blue leather straps, snow camouflage cloak, heavy boots
    negative_prompt: >-
      (worst quality, low quality:1.3), lowres, blurry, nude, extra limbs, text
    targets: [cloth]
    palette_hint:
      cloth_main: "#dfe8ef"
      cloth_dark: "#9fb3c2"
      cloth_accent: "#5f7f9c"
      leather: "#4a5560"

  desert_nomad:
    prompt: >-
      masterpiece, best quality, 1boy, desert nomad outfit, sand colored linen wrap,
      copper buckles, layered scarf, worn leather boots
    negative_prompt: >-
      (worst quality, low quality:1.3), lowres, blurry, nude, extra limbs, text
    targets: [cloth]
    palette_hint:
      cloth_main: "#d9c09a"
      cloth_dark: "#a8865c"
      cloth_accent: "#b5651d"
      leather: "#6f4b2a"
