# 帆坂 忍 —— 《雾见町 遗物招领所》配角
# 设定：docs/kirimicho/04-角色-帆坂忍.md
# 剪影识别点：雨衣尖帽 + 旧书包
#
# 灵体表现：膝盖以下逐渐半透明，脚踝处化为淡雾，**不画脚**。
# 所以这份概念里没有任何 foot 部件，小腿用灵体雾色代替。
id: shinobu
bible: kirimicho/shinobu
archetype: 孩童灵

canvas:
  width: 448
  height: 576
  origin_x: 224
  origin_y: 520

# 设定集给的顺序：雨衣 / 雨衣影 / 短裤 / 书包 / 雨靴
aliases:
  raincoat: costume
  raincoat_shadow: costume_2
  shorts: costume_3
  satchel: costume_4
  rainboot: costume_5
  spirit_mist: accent    # 灵体雾 60%
  bandage: accent_2      # 创可贴

palette:
  stripe: "#FFFFFF"      # 袖口的两道白色反光条
  bell: "#C9A227"        # 书包扣带上的小铃铛

animations: [idle, breath, walk, run, wave]

groups:
  - [L_thigh, L_mist]
  - [R_thigh, R_mist]
  - [raincoat_body, raincoat_skirt]

parts:
  - {name: satchel,          bone: chest,       shape: plate,   size: [0.80, 0.70], offset: [0, -0.30], color: satchel, order: 0,  tags: [prop, bag]}
  - {name: satchel_bell,     bone: chest,       shape: ellipse, size: [0.14, 0.14], offset: [0.34, -0.55], color: bell, order: 1, redraw: false, tags: [prop]}
  - {name: back_hair,        bone: head,        shape: bell,    size: [0.98, 0.85], offset: [0, 0.38], color: hair_2, order: 2, redraw: false, tags: [hair]}
  - {name: L_thigh,          bone: thigh_l,     shape: capsule, size: [0.34, "thigh*0.8"], offset: [0, "thigh*0.55"], color: skin, order: 3, redraw: false, tags: [skin, lower]}
  # 膝盖以下化为淡雾，不画脚也不画影子
  - {name: L_mist,           bone: shin_l,      shape: cone,    size: [0.34, "shin*0.9"],  offset: [0, "shin*0.42"], rotation: 180, color: spirit_mist, order: 4, redraw: false, tags: [spirit]}
  - {name: raincoat_sleeve_l, bone: upper_arm_l, shape: capsule, size: [0.44, "upper_arm*1.05"], offset: [0, "upper_arm*0.5"], color: raincoat, order: 5, tags: [cloth, upper]}
  - {name: raincoat_cuff_l,  bone: lower_arm_l, shape: capsule, size: [0.40, "lower_arm*0.9"], offset: [0, "lower_arm*0.45"], color: raincoat, order: 6, tags: [cloth, upper]}
  - {name: L_cuff_stripe,    bone: lower_arm_l, shape: plate,   size: [0.42, 0.09], offset: [0, "lower_arm*0.82"], color: stripe, order: 7, tags: [cloth, accessory]}
  - {name: L_hand,           bone: hand_l,      shape: ellipse, size: [0.26, 0.26], offset: [0, 0.10], color: skin, order: 8, redraw: false, tags: [skin]}
  - {name: shorts,           bone: hip,         shape: bell,    size: [0.76, 0.48], offset: [0, -0.16], color: shorts, order: 9, tags: [cloth, lower]}
  - {name: R_thigh,          bone: thigh_r,     shape: capsule, size: [0.34, "thigh*0.8"], offset: [0, "thigh*0.55"], color: skin, order: 10, redraw: false, tags: [skin, lower]}
  - {name: R_mist,           bone: shin_r,      shape: cone,    size: [0.34, "shin*0.9"],  offset: [0, "shin*0.42"], rotation: 180, color: spirit_mist, order: 11, redraw: false, tags: [spirit]}
  - {name: raincoat_body,    bone: torso,       shape: capsule, size: [0.90, "torso+chest*0.85"], offset: [0, "torso*0.60"], color: raincoat, order: 12, tags: [cloth, upper]}
  # 雨衣下摆及大腿
  - {name: raincoat_skirt,   bone: hip,         shape: bell,    size: [1.00, 0.70], offset: [0, -0.22], color: raincoat, order: 13, tags: [cloth, lower]}
  - {name: neck,             bone: neck,        shape: capsule, size: [0.24, 0.24], offset: [0, 0.10], color: skin_2, order: 14, redraw: false, tags: [skin]}
  # 帽子基本常戴，帽檐画成略硬的尖角——剪影识别点。
  # 排在头部之前（更底层），只露出头顶的尖角轮廓而不遮住脸
  - {name: raincoat_hood,    bone: head,        shape: cone,    size: [1.25, 1.15], offset: [0, 0.66], color: raincoat, order: 15, tags: [cloth, hood]}
  - {name: head_base,        bone: head,        shape: ellipse, size: [0.80, 0.92], offset: [0, 0.46], color: skin, order: 16, redraw: false, tags: [skin, face]}
  # 高光面积是全员最大（占瞳孔 1/3），负责"生命力"
  - {name: L_eye,            bone: head,        shape: ellipse, size: [0.21, 0.24], offset: [-0.18, 0.40], color: eye, order: 17, redraw: false, tags: [face]}
  - {name: R_eye,            bone: head,        shape: ellipse, size: [0.21, 0.24], offset: [0.18, 0.40], color: eye, order: 18, redraw: false, tags: [face]}
  # 左脸颊的创可贴，十年不变，从未换过
  - {name: cheek_bandage,    bone: head,        shape: plate,   size: [0.20, 0.11], offset: [-0.30, 0.30], rotation: 20, color: bandage, order: 19, redraw: false, tags: [face]}
  - {name: front_hair,       bone: head,        shape: bell,    size: [0.92, 0.52] , offset: [0, 0.76], color: hair, order: 20, redraw: false, tags: [hair]}
  - {name: raincoat_sleeve_r, bone: upper_arm_r, shape: capsule, size: [0.44, "upper_arm*1.05"], offset: [0, "upper_arm*0.5"], color: raincoat, order: 21, tags: [cloth, upper]}
  - {name: raincoat_cuff_r,  bone: lower_arm_r, shape: capsule, size: [0.40, "lower_arm*0.9"], offset: [0, "lower_arm*0.45"], color: raincoat, order: 22, tags: [cloth, upper]}
  - {name: R_cuff_stripe,    bone: lower_arm_r, shape: plate,   size: [0.42, 0.09], offset: [0, "lower_arm*0.82"], color: stripe, order: 23, tags: [cloth, accessory]}
  - {name: R_hand,           bone: hand_r,      shape: ellipse, size: [0.26, 0.26], offset: [0, 0.10], color: skin, order: 24, redraw: false, tags: [skin]}

outfits:
  # 差分 C：生前（10 年前 · 同款雨衣但崭新）
  alive_ten_years_ago:
    prompt: >-
      masterpiece, best quality, anime cel shading, hard-edged shadows, 1child,
      brand new bright yellow hooded raincoat, crisp white reflective stripes,
      clean red rain boots, brown shorts, flat color blocks, TV anime style
    negative_prompt: >-
      (worst quality, low quality:1.3), lowres, blurry, worn out, faded,
      soft gradient, airbrush, extra limbs, text, watermark
    targets: [cloth]
    palette_hint:
      raincoat: "#FFD84D"
      raincoat_shadow: "#E0AC22"
      shorts: "#7A5638"

  # 雨停后的替换装，用于日常回
  clear_day:
    prompt: >-
      masterpiece, best quality, anime cel shading, hard-edged shadows, 1child,
      pale mint windbreaker, cream shorts, simple cotton fabric,
      flat color blocks, TV anime style
    negative_prompt: >-
      (worst quality, low quality:1.3), lowres, blurry, soft gradient, airbrush,
      extra limbs, text
    targets: [cloth]
    palette_hint:
      raincoat: "#BFE0CE"
      raincoat_shadow: "#94BCA6"
      shorts: "#E8DCC4"
      stripe: "#F5F5F0"
