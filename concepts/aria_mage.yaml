id: aria_mage
name: 艾莉雅
archetype: mage
summary: 星纹法袍的少女法师，手持长杖，飘带与长发是她的动态识别点。

canvas:
  width: 448
  height: 576
  origin_x: 224
  origin_y: 520

palette:
  skin: "#f6d9c2"
  skin_shadow: "#e0b294"
  hair: "#8d6ce0"
  hair_dark: "#5f45a3"
  cloth_main: "#f3f1ff"
  cloth_dark: "#b9b2e8"
  cloth_accent: "#6f5bd6"
  metal: "#e6c25a"
  eye: "#3f7de0"
  leather: "#7a5b46"

rig:
  unit: 4.0
  hip_height: 42
  torso: 14
  chest: 12
  neck: 4
  head: 16
  upper_arm: 12
  lower_arm: 11
  hand: 4
  thigh: 18
  shin: 17
  foot: 5
  shoulder_span: 8
  hip_span: 5

animations: [idle, breath, walk, run, wave, cast]

groups:
  - [L_thigh, L_shin, L_foot]
  - [R_thigh, R_shin, R_foot]
  - [body_cloth, skirt]
  - [L_sleeve, L_cuff]
  - [R_sleeve, R_cuff]

parts:
  - {name: cape,        bone: chest,       shape: cape,    size: [26, 44], offset: [0, -8],  color: cloth_accent, order: 0,  tags: [cloth, back]}
  - {name: back_hair,   bone: head,        shape: bell,    size: [22, 34], offset: [0, 4],   color: hair_dark,    order: 1,  redraw: false, tags: [hair]}
  - {name: L_thigh,     bone: thigh_l,     shape: capsule, size: [7, 18],  offset: [0, 9],   color: cloth_dark,   order: 2,  tags: [cloth, lower]}
  - {name: L_shin,      bone: shin_l,      shape: capsule, size: [6, 17],  offset: [0, 8.5], color: cloth_dark,   order: 3,  tags: [cloth, lower]}
  - {name: L_foot,      bone: foot_l,      shape: plate,   size: [9, 5],   offset: [1, 2],   color: leather,      order: 4,  tags: [cloth, lower, shoe]}
  - {name: L_sleeve,    bone: upper_arm_l, shape: capsule, size: [7, 13],  offset: [0, 6],   color: cloth_main,   order: 5,  tags: [cloth, upper]}
  - {name: L_cuff,      bone: lower_arm_l, shape: capsule, size: [6, 12],  offset: [0, 5.5], color: cloth_main,   order: 6,  tags: [cloth, upper]}
  - {name: L_hand,      bone: hand_l,      shape: ellipse, size: [5, 5],   offset: [0, 2],   color: skin,         order: 7,  redraw: false, tags: [skin]}
  - {name: body_cloth,  bone: torso,       shape: capsule, size: [15, 26], offset: [0, 12],  color: cloth_main,   order: 8,  tags: [cloth, upper]}
  - {name: sash,        bone: torso,       shape: plate,   size: [16, 4],  offset: [0, 3],   color: cloth_accent, order: 9,  tags: [cloth, accessory]}
  - {name: skirt,       bone: hip,         shape: bell,    size: [24, 20], offset: [0, -8],  color: cloth_main,   order: 10, tags: [cloth, lower]}
  - {name: R_thigh,     bone: thigh_r,     shape: capsule, size: [7, 18],  offset: [0, 9],   color: cloth_dark,   order: 11, tags: [cloth, lower]}
  - {name: R_shin,      bone: shin_r,      shape: capsule, size: [6, 17],  offset: [0, 8.5], color: cloth_dark,   order: 12, tags: [cloth, lower]}
  - {name: R_foot,      bone: foot_r,      shape: plate,   size: [9, 5],   offset: [1, 2],   color: leather,      order: 13, tags: [cloth, lower, shoe]}
  - {name: neck,        bone: neck,        shape: capsule, size: [5, 5],   offset: [0, 2],   color: skin_shadow,  order: 14, redraw: false, tags: [skin]}
  - {name: collar,      bone: chest,       shape: plate,   size: [12, 4],  offset: [0, 11],  color: cloth_accent, order: 15, tags: [cloth, accessory]}
  - {name: head_base,   bone: head,        shape: ellipse, size: [16, 18], offset: [0, 8],   color: skin,         order: 16, redraw: false, tags: [skin, face]}
  - {name: L_eye,       bone: head,        shape: ellipse, size: [3, 4],   offset: [-3.6, 7], color: eye,         order: 17, redraw: false, tags: [face]}
  - {name: R_eye,       bone: head,        shape: ellipse, size: [3, 4],   offset: [3.6, 7],  color: eye,         order: 18, redraw: false, tags: [face]}
  - {name: front_hair,  bone: head,        shape: bell,    size: [19, 12], offset: [0, 13],  color: hair,         order: 19, redraw: false, tags: [hair]}
  - {name: hair_ribbon, bone: head,        shape: blade,   size: [4, 16],  offset: [-9, 12], rotation: 24, color: cloth_accent, order: 20, tags: [cloth, accessory]}
  - {name: R_sleeve,    bone: upper_arm_r, shape: capsule, size: [7, 13],  offset: [0, 6],   color: cloth_main,   order: 21, tags: [cloth, upper]}
  - {name: R_cuff,      bone: lower_arm_r, shape: capsule, size: [6, 12],  offset: [0, 5.5], color: cloth_main,   order: 22, tags: [cloth, upper]}
  - {name: R_hand,      bone: hand_r,      shape: ellipse, size: [5, 5],   offset: [0, 2],   color: skin,         order: 23, redraw: false, tags: [skin]}
  - {name: staff,       bone: hand_r,      shape: blade,   size: [3, 46],  offset: [2, 10],  rotation: 8, color: metal, order: 24, tags: [weapon]}

outfits:
  starlight_robe:
    prompt: >-
      masterpiece, best quality, 1girl, starlight mage robe, deep blue gown,
      silver star embroidery, long wide sleeves, layered skirt, gold trim,
      flowing sash, thigh boots
    negative_prompt: >-
      (worst quality, low quality:1.3), lowres, blurry, nude, bare, see through,
      extra limbs, text, watermark
    targets: [cloth]
    palette_hint:
      cloth_main: "#26325e"
      cloth_dark: "#161d3c"
      cloth_accent: "#c9a44a"
      leather: "#2b2440"
    denoising_strength: 0.72

  crimson_ritual:
    prompt: >-
      masterpiece, best quality, 1girl, crimson ritual dress, black lace,
      red velvet, ornate gold buckles, asymmetric skirt, high boots
    negative_prompt: >-
      (worst quality, low quality:1.3), lowres, blurry, nude, bare, see through,
      extra limbs, text, watermark
    targets: [cloth]
    palette_hint:
      cloth_main: "#8e1f2c"
      cloth_dark: "#4a1018"
      cloth_accent: "#1a1a1f"
      leather: "#241014"

  summer_casual:
    prompt: >-
      masterpiece, best quality, 1girl, white summer sundress, light blue ribbon,
      straw texture accents, short sleeves, sandals
    negative_prompt: >-
      (worst quality, low quality:1.3), lowres, blurry, nude, extra limbs, text
    targets: [cloth, accessory]
    palette_hint:
      cloth_main: "#fbfaf4"
      cloth_dark: "#d9e6f2"
      cloth_accent: "#7fb8dd"
      leather: "#c9a37a"
