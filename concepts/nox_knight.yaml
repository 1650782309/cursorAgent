id: nox_knight
name: 诺克斯
archetype: knight
summary: 重甲骑士，部件面积大且相互遮挡严重，用来压测关键姿势选取算法的覆盖率收敛。

canvas:
  width: 448
  height: 576
  origin_x: 248
  origin_y: 520

palette:
  skin: "#e9c9ab"
  skin_shadow: "#c69a78"
  hair: "#2f3440"
  hair_dark: "#1c2029"
  cloth_main: "#7f8b99"
  cloth_dark: "#4e5966"
  cloth_accent: "#8c2f3a"
  metal: "#c9ced6"
  eye: "#d64b4b"
  leather: "#3a3129"

rig:
  unit: 4.2
  hip_height: 42
  torso: 14
  chest: 13
  neck: 3
  head: 15
  upper_arm: 12
  lower_arm: 11
  hand: 4
  thigh: 18
  shin: 17
  foot: 6
  shoulder_span: 10
  hip_span: 6

animations: [idle, breath, walk, cast]

groups:
  - [L_thigh, L_shin, L_foot]
  - [R_thigh, R_shin, R_foot]
  - [body_cloth, skirt]
  - [L_sleeve, L_cuff]
  - [R_sleeve, R_cuff]

parts:
  - {name: cape,        bone: chest,       shape: cape,    size: [30, 48], offset: [0, -9],  color: cloth_accent, order: 0,  tags: [cloth, back]}
  - {name: back_hair,   bone: head,        shape: bell,    size: [17, 20], offset: [0, 5],   color: hair_dark,    order: 1,  redraw: false, tags: [hair]}
  - {name: L_thigh,     bone: thigh_l,     shape: capsule, size: [9, 18],  offset: [0, 9],   color: metal,        order: 2,  tags: [armor, lower]}
  - {name: L_shin,      bone: shin_l,      shape: capsule, size: [8, 17],  offset: [0, 8.5], color: metal,        order: 3,  tags: [armor, lower]}
  - {name: L_foot,      bone: foot_l,      shape: plate,   size: [11, 6],  offset: [1, 2],   color: cloth_dark,   order: 4,  tags: [armor, lower, shoe]}
  - {name: L_sleeve,    bone: upper_arm_l, shape: capsule, size: [9, 13],  offset: [0, 6],   color: metal,        order: 5,  tags: [armor, upper]}
  - {name: L_cuff,      bone: lower_arm_l, shape: capsule, size: [7, 12],  offset: [0, 5.5], color: cloth_dark,   order: 6,  tags: [armor, upper]}
  - {name: L_hand,      bone: hand_l,      shape: ellipse, size: [5, 5],   offset: [0, 2],   color: leather,      order: 7,  redraw: false, tags: [skin]}
  - {name: body_cloth,  bone: torso,       shape: capsule, size: [18, 27], offset: [0, 12],  color: metal,        order: 8,  tags: [armor, upper]}
  - {name: sash,        bone: torso,       shape: plate,   size: [19, 5],  offset: [0, 3],   color: cloth_accent, order: 9,  tags: [armor, accessory]}
  - {name: skirt,       bone: hip,         shape: bell,    size: [24, 16], offset: [0, -6],  color: cloth_dark,   order: 10, tags: [armor, lower]}
  - {name: R_thigh,     bone: thigh_r,     shape: capsule, size: [9, 18],  offset: [0, 9],   color: metal,        order: 11, tags: [armor, lower]}
  - {name: R_shin,      bone: shin_r,      shape: capsule, size: [8, 17],  offset: [0, 8.5], color: metal,        order: 12, tags: [armor, lower]}
  - {name: R_foot,      bone: foot_r,      shape: plate,   size: [11, 6],  offset: [1, 2],   color: cloth_dark,   order: 13, tags: [armor, lower, shoe]}
  - {name: neck,        bone: neck,        shape: capsule, size: [6, 4],   offset: [0, 2],   color: skin_shadow,  order: 14, redraw: false, tags: [skin]}
  - {name: collar,      bone: chest,       shape: plate,   size: [16, 5],  offset: [0, 12],  color: metal,        order: 15, tags: [armor, accessory]}
  - {name: head_base,   bone: head,        shape: ellipse, size: [15, 17], offset: [0, 8],   color: skin,         order: 16, redraw: false, tags: [skin, face]}
  - {name: L_eye,       bone: head,        shape: ellipse, size: [3, 4],   offset: [-3.4, 7], color: eye,         order: 17, redraw: false, tags: [face]}
  - {name: R_eye,       bone: head,        shape: ellipse, size: [3, 4],   offset: [3.4, 7],  color: eye,         order: 18, redraw: false, tags: [face]}
  - {name: front_hair,  bone: head,        shape: bell,    size: [16, 11], offset: [0, 12],  color: hair,         order: 19, redraw: false, tags: [hair]}
  - {name: helm,        bone: head,        shape: plate,   size: [17, 6],  offset: [0, 15],  color: metal,        order: 20, tags: [armor, accessory]}
  - {name: R_sleeve,    bone: upper_arm_r, shape: capsule, size: [9, 13],  offset: [0, 6],   color: metal,        order: 21, tags: [armor, upper]}
  - {name: R_cuff,      bone: lower_arm_r, shape: capsule, size: [7, 12],  offset: [0, 5.5], color: cloth_dark,   order: 22, tags: [armor, upper]}
  - {name: R_hand,      bone: hand_r,      shape: ellipse, size: [5, 5],   offset: [0, 2],   color: leather,      order: 23, redraw: false, tags: [skin]}
  - {name: greatsword,  bone: hand_r,      shape: blade,   size: [7, 50],  offset: [3, 14],  rotation: 6, color: metal, order: 24, tags: [weapon]}

outfits:
  obsidian_vow:
    prompt: >-
      masterpiece, best quality, 1boy, obsidian black plate armor, gold filigree,
      dark red tabard, heavy pauldrons, engraved greaves
    negative_prompt: >-
      (worst quality, low quality:1.3), lowres, blurry, nude, extra limbs, text
    targets: [armor]
    palette_hint:
      metal: "#2a2c33"
      cloth_dark: "#17181d"
      cloth_accent: "#8a6a22"

  dawn_paladin:
    prompt: >-
      masterpiece, best quality, 1boy, radiant white and gold paladin armor,
      sunburst emblem, ivory plates, blue cloth underlayer
    negative_prompt: >-
      (worst quality, low quality:1.3), lowres, blurry, nude, extra limbs, text
    targets: [armor]
    palette_hint:
      metal: "#f0ead9"
      cloth_dark: "#c9a227"
      cloth_accent: "#3a5fa8"
